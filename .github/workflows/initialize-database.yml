name: Initialize Fast Zone Database

on:
  workflow_dispatch:
    inputs:
      confirm_empty_database:
        description: 'I created a NEW EMPTY D1 database for this installation'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fast-zone-database-initialization
  cancel-in-progress: false

jobs:
  initialize:
    if: ${{ inputs.confirm_empty_database }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Import into new empty D1 database
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: node scripts/import-database.mjs
